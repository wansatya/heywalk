[project]
name = "heywalk-api"
version = "0.1.0"
description = "HeyWalk FastAPI backend: projects, AI generation, run orchestration (AGENTS.md sections 5, 10-12)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  # Robot Foundry: uploads, image processing, mesh generation, and the
  # short-lived MuJoCo validation subprocess all run in the API image.
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "Pillow>=10.4",
  "trimesh>=4.4",
  "mujoco>=3.2",
  # Official SAM 3.1 output parser and mask decoder (zero dependencies).
  "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
# The MuJoCo physics engine runs inside the isolated runner (and in the
# automated-test path). The API process never imports it: evaluation works
# from recorded test evidence only (see app/simulator/mujoco_tests.py).
sim = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "onnxruntime>=1.20",
]
test = [
  "pytest>=8",
  "mujoco>=3.2",
  "numpy>=1.26",
  "onnxruntime>=1.20",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The service code lives in app/ only. Explicit discovery keeps sibling
# dev-data dirs (projects/, tests/, scripts/) out of the distribution.
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
