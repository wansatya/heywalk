# HeyWalk web proxy: static IDE + same-origin /api to the FastAPI service.
# The /api/ location carries both REST and the run-event WebSocket
# (/api/runs/{id}/stream), so Upgrade headers and long timeouts are required.

upstream heywalk_api {
  server api:8000;
}

# Bulk responses (JS bundles, API JSON incl. telemetry, STL meshes) gzip
# here so slow links spend less time with the connection pool saturated.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
  text/plain text/css text/javascript application/javascript application/json
  image/svg+xml model/stl application/octet-stream;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Arena-wall billboards: missing slots must fail fast with a tiny 404.
  # Without this they fall through to /index.html (HTTP 200), so the 3D
  # view downloads the whole SPA shell ~30 times per load while probing
  # for ad images. Hits cache for a day (expires skips the 404s).
  location /ads/ {
    try_files $uri =404;
    expires 1d;
  }

  # Vite emits content-hashed filenames under /assets/, so they are
  # immutable and safe to cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://heywalk_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Health check is served by the API at both /health and /api/health.
  location = /health {
    proxy_pass http://heywalk_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
