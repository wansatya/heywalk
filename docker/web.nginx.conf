# HeyWalk web proxy: static IDE + same-origin /api to the FastAPI service.
# The /api/ location carries both REST and the run-event WebSocket
# (/api/runs/{id}/stream), so Upgrade headers and long timeouts are required.

upstream heywalk_api {
  server api:8000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://heywalk_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Health check is served by the API at both /health and /api/health.
  location = /health {
    proxy_pass http://heywalk_api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
