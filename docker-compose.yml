# HeyWalk local stack.
#
# SECURITY NOTES (AGENTS.md section 12):
# - The `api` service mounts the Docker socket so the orchestrator can launch
#   one SIBLING container per run from the runner image. This is the
#   orchestrator only: generated controller code never runs in `api`, and run
#   containers themselves get no socket, no network, no secrets, and a
#   non-root user (see services/api/app/runner/docker_runner.py).
# - Run staging bind-mounts the host path /tmp/heywalk-staging at the SAME
#   path inside `api`: the API stages controller files there (TMPDIR) and
#   sibling run containers bind-mount that host path. The paths must match
#   because the daemon resolves bind sources on the host. `make up` creates
#   it; contents are per-run temp files with no secrets (child env is
#   scrubbed, see app/runner/staging.py).
# - MODEL_API_KEY is provided at runtime via ${MODEL_API_KEY} / .env and is
#   never baked into images or exported with projects.
# - Host alternative (no compose): from services/api run
#     HEYWALK_DB=./heywalk.db RUNNER_BACKEND=docker \
#       .venv/bin/uvicorn app.main:app --port 8000
#   with the `docker` CLI on PATH and the runner image built.
#
# Images:
#   docker compose build                                # web + api images
#   docker compose build --profile runner-build runner  # isolated-runner image (ROS 2 Jazzy)
#
# Full stack:
#   MODEL_API_KEY=[redacted] docker compose up --build
#   Open http://localhost:8080 (web UI; same-origin /api proxied to the api service).

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: heywalk-web:latest
    ports:
      - "1666:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: heywalk-api:latest
    ports:
      - "8000:8000"
    environment:
      HEYWALK_DB: /srv/api/data/heywalk.db
      HEYWALK_SEQUENCES: /srv/api/sequences
      TMPDIR: /tmp/heywalk-staging
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MUSE_MODEL: ${MUSE_MODEL:-muse-spark-1.3}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-docker}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-heywalk-runner:jazzy}
      RUNNER_TIMEOUT_S: ${RUNNER_TIMEOUT_S:-180}
      # MuJoCo + ONNX + rclpy live in one ~500 MiB process (see docs), so the
      # cap leaves ~2x headroom: at 512m a run already touched the ceiling.
      RUNNER_MEMORY: ${RUNNER_MEMORY:-1024m}
      MAX_FIX_ATTEMPTS: ${MAX_FIX_ATTEMPTS:-2}
    volumes:
      - heywalk-data:/srv/api/data
      - ./sequences:/srv/api/sequences
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/heywalk-staging:/tmp/heywalk-staging
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Build-only profile: produces the image each run container starts from.
  # Never run sequences through `docker compose run runner` directly;
  # the API stages per-run workspaces and launches one container per run.
  # The image bundles MuJoCo (headless) for the primary simulation backend.
  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    image: heywalk-runner:jazzy
    profiles: ["runner-build"]

volumes:
  heywalk-data:
